name: Ошибка расширения / Extension bug
description: Воспроизводимая ошибка в опубликованной версии. Не прикладывайте ключи, код клиентов и персональные данные.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Укажите точную опубликованную версию расширения. Используйте только обезличенный минимальный пример. Не публикуйте API-ключи, приватный BSL, метаданные клиента, сырые технологические журналы или снимки экрана с ними.
  - type: input
    id: extension_version
    attributes:
      label: Версия расширения
      placeholder: 1.0.11
    validations:
      required: true
  - type: input
    id: ide
    attributes:
      label: IDE и версия
      placeholder: VS Code 1.x / Cursor 1.x, OS
    validations:
      required: true
  - type: input
    id: onec
    attributes:
      label: Платформа и конфигурация 1С, если сценарий их затрагивает
      placeholder: 8.3.x, собственная учебная конфигурация / не применимо
  - type: dropdown
    id: area
    attributes:
      label: Сценарий
      options:
        - Установка и запуск
        - AI-генерация или объяснение
        - Автодополнение
        - Preview, применение или Undo
        - Локальные инструменты
        - MCP или Sidecar
        - Другое
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Минимальный пример только на собственных/синтетических данных.
      placeholder: "1. Открыл тестовый .bsl...\n2. Выполнил...\n3. Получил..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактический результат и статус
      description: Укажите точный текст ошибки без ключей/кода; если можно, класс HTTP и время ожидания.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка перед отправкой
      options:
        - label: В тексте и вложениях нет API-ключей, клиентского кода и персональных данных.
          required: true
