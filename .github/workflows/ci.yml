name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run compile

      - name: Lint Python Sidecar
        run: |
          pip install "ruff==0.15.19"
          ruff check sidecar/

      - name: Run Test Suite
        run: npm test

      - name: Build Bundle
        run: npm run build

      - name: Package VSIX
        run: python3 build_vsix.py

      - name: Resolve exact VSIX artifact
        run: |
          VSIX="$(node -p "require('./package.json').name + '-' + require('./package.json').version + '.vsix'")"
          echo "RELEASE_VSIX=$VSIX" >> "$GITHUB_ENV"

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1c-bsl-ai-copilot-vsix
          path: "${{ env.RELEASE_VSIX }}"
